plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

tasks.named("remapJar") {
    archiveFileName = "ShortMappet.jar"
}

repositories {
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:intermediary:${project.minecraft_version}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation name: 'blockbuster-2.7.3-1.20.1', ext: 'jar'

    compileOnly files('src/main/resources/META-INF/jars/javassist-3.28.0-GA.jar')
    compileOnly files('src/main/resources/META-INF/jars/nashorn-core-15.4.jar')
    compileOnly files('src/main/resources/META-INF/jars/reflections-0.10.2.jar')
    compileOnly "org.mozilla:rhino:1.7.15"
    compileOnly "de.maxhenkel.voicechat:voicechat-api:2.5.0"
    compileOnly "javax.vecmath:vecmath:1.5.2"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }

    repositories {
    }
}
